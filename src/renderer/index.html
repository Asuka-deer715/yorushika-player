<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob: local-media:; object-src 'none'; base-uri 'none'">
<title>ヨルシカ · 播放器体验原型</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="intro" class="intro" aria-label="开场动画"><div class="intro-core"><span id="introMark" aria-label="Yorushika">Yorushika</span><span>PRIVATE LISTENING ROOM</span></div><div class="intro-cover"></div><button id="skipIntro" class="intro-skip">跳过开场</button></div>
<div class="app">
 <aside class="sidebar"><div class="side-top"><strong>Yorushika</strong></div><nav class="nav" aria-label="主导航"><button data-view="home" class="active">乐队作品</button><button data-view="related">个人与合作</button><button data-view="mv">正式 MV</button><button data-view="playlists">我的歌单</button><button data-view="imports">导入与待整理</button></nav><div class="side-art-wrap hidden" id="sideArtWrap"><div class="side-art" id="sideArt"></div></div></aside>
 <main class="workspace"><header class="topbar"><div class="wordmark"><img src="./yorushika-official-mark.svg" alt="Yorushika 官方标志"></div><div class="actions"><button class="settings-button" id="settingsToggle" title="设置" aria-label="打开设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.9h4.8l.5 2.1 1.7.7 1.9-1.1 3.4 3.4-1.1 1.9.7 1.7 2.1.5v4.8l-2.1.5-.7 1.7 1.1 1.9-3.4 3.4-1.9-1.1-1.7.7-.5 2.1H9.6l-.5-2.1-1.7-.7-1.9 1.1-3.4-3.4 1.1-1.9-.7-1.7-2.1-.5v-4.8l2.1-.5.7-1.7-1.1-1.9 3.4-3.4 1.9 1.1 1.7-.7.5-2.1Z" transform="translate(0,-1.5) scale(.92) translate(1,1)"/><circle cx="12" cy="12" r="3.2"/></svg></button></div></header><div id="content" class="content"></div></main>
 <footer class="player"><div class="now" id="openNow" role="button" tabindex="0" aria-label="打开完整播放页面"><div class="now-art">♪</div><div class="now-text"><strong id="nowTitle">还没有播放</strong><small id="nowSubtitle">导入本地音频开始体验</small></div></div><div class="transport"><div class="transport-row"><button id="prev" aria-label="上一首">◀◀</button><button id="play" class="primary" aria-label="播放或暂停">▶</button><button id="next" aria-label="下一首">▶▶</button></div><div class="timeline"><span id="timeNow">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="timeTotal">0:00</span></div></div><div class="player-right"><button id="showMv">看 MV</button><button id="showLyrics">歌词</button><input id="volume" type="range" min="0" max="100" value="75" aria-label="音量"></div></footer>
</div>
<input id="audioInput" class="file-input" type="file" accept="audio/*,.flac,.mp3,.m4a,.wav,.ogg" multiple><input id="mvInput" class="file-input" type="file" accept="video/*,.mp4,.webm,.mkv" multiple><input id="lrcInput" class="file-input" type="file" accept=".lrc,text/plain">
<audio id="audio"></audio><video id="video"></video>
<script src="../core/lyrics.js"></script>
<script src="../core/playback.js"></script>
<script src="./logo-data.js"></script>
<script src="./library-client.js"></script>
<script src="./app.js"></script>
</body>
</html>
